name: CI validation

# Always emit PR checks: path-filtered required checks can remain pending.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel outdated PR runs; do not cancel a main branch validation.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test documentation validator
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check documentation
        run: python scripts/check_docs.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Install dependencies
        run: npm ci
      - name: Test domain logic
        run: npm test
      - name: Typecheck Nuxt
        run: npm run typecheck
      - name: Build Nuxt
        run: npm run build

  postgres-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mercadinho_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d mercadinho_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - name: Test PostgreSQL migrations and stock posting
        run: |
          psql -h localhost -U test -d mercadinho_test -v ON_ERROR_STOP=1 -f tests/postgres_smoke.sql
          psql -h localhost -U test -d mercadinho_test -v ON_ERROR_STOP=1 -f tests/postgres_security.sql
      - name: Test concurrent stock movements
        run: bash tests/postgres_concurrency.sh
      - name: Test tenant row-level security
        run: psql -h localhost -U test -d mercadinho_test -v ON_ERROR_STOP=1 -f tests/postgres_rls.sql
      - name: Test restricted backend role stock posting
        run: psql -h localhost -U test -d mercadinho_test -v ON_ERROR_STOP=1 -f tests/postgres_restricted_role.sql
